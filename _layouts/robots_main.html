<html lang="en">
        
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta name="description" content="">
        <meta name="author" content="">
        <link rel="icon" href="/img/favicon.ico">
    
        <title>{{ page.title }} - Team 4099</title>
    
        <!-- Custom styles for this template -->
        {% include topImports.html %}
    </head>
    
    <body>
        <header>
            {% include navbar.html %}
        </header>
        <div class="container">          
            <h2>{{ page.title }}</h2>
            <br>
            <div class="robots-list mt-4">
                {% for robot_page in site.robots reversed %}            
                    <div class="row robot-entry-card align-items-center mb-5 p-4">
                        <div class="col-lg-8 robot-entry-text">
                            <h3>{{ robot_page.title }}</h3>
                            <hr>
                            <p class="mb-4">{{ robot_page.excerpt }}</p>
                            <a href="{{ robot_page.url }}" class="btn btn-info">Read More →</a>
                        </div>
                        <div class="col-lg-4 d-none d-lg-block text-center robot-entry-img-container">
                            <img class="img-fluid robot-entry-img" src="{{ robot_page.image_url }}" alt="{{ robot_page.year }} Robot">
                        </div>
                    </div>
                {% endfor %}
            </div>
            <br>
        </div>
    
        <footer class="footer">
            <div class="container">
                <span class="text-muted">{% include footerContents.html %}</span>
            </div>
        </footer>

        {% include bottomImports.html %}
        
    
    </body>
        
</html>
